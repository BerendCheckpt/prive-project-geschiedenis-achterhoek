name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: geschiedenis_test
          POSTGRES_USER: geschiedenis
          POSTGRES_PASSWORD: geschiedenis
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U geschiedenis" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: app
    env:
      TEST_DATABASE_URL: postgres://geschiedenis:geschiedenis@localhost:5432/geschiedenis_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm test

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Build image with Podman
        run: podman build -f Containerfile -t localhost/geschiedenis-achterhoek:${{ github.sha }} .
      - name: Push to GHCR (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}
          echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u "${{ github.actor }}" --password-stdin
          podman tag localhost/geschiedenis-achterhoek:${{ github.sha }} $IMAGE:${{ github.sha }} $IMAGE:latest
          podman push $IMAGE:${{ github.sha }}
          podman push $IMAGE:latest
