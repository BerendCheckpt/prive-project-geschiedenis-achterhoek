# Local / single-host setup: `podman-compose up -d` (or `podman compose up -d`).
# Copy .env.example to .env first and set real secrets.
services:
  db:
    image: docker.io/library/postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-geschiedenis}
      POSTGRES_USER: ${POSTGRES_USER:-geschiedenis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?zet POSTGRES_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Containerfile
    image: localhost/geschiedenis-achterhoek:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-geschiedenis}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-geschiedenis}
      SESSION_SECRET: ${SESSION_SECRET:?zet SESSION_SECRET in .env}
      SECURE_COOKIES: ${SECURE_COOKIES:-false}
      SEED_DEMO: ${SEED_DEMO:-true}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-200}
    ports:
      - "${APP_PORT:-3000}:3000"
    volumes:
      # dedicated media folder on the host; :Z relabels it for SELinux hosts (Podman)
      - ${MEDIA_HOST_DIR:-./data/media}:/data/media:Z

volumes:
  db-data:
