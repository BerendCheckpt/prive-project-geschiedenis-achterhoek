<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Thema – Geschiedenis Achterhoek</title>
  <link rel="stylesheet" href="/vendor/w3css/w3.css">
  <link rel="stylesheet" href="/theme.css" id="theme-css">
  <link rel="stylesheet" href="/css/app.css">
  <script src="/vendor/w3js/w3.js"></script>
</head>
<body class="w3-theme-l5">
  <div w3-include-html="/components/navbar.html"></div>
  <main class="app-below-nav">
    <div class="w3-content w3-container w3-padding-16">
      <h2>Thema</h2>
      <p class="w3-text-grey">Kies het kleurenthema van de hele website. Klik op een thema voor een voorbeeld en sla het daarna op.</p>
      <div data-messages></div>
      <div class="w3-row-padding w3-stretch" id="themes"></div>

      <h4>Voorbeeld</h4>
      <div class="w3-card w3-white w3-margin-bottom">
        <div class="w3-bar w3-theme-d2"><span class="w3-bar-item">Navigatie</span></div>
        <div class="w3-container w3-padding-16">
          <button class="w3-button w3-theme w3-round">Knop</button>
          <span class="w3-tag w3-theme-l3 w3-round">Categorie</span>
          <span class="w3-tag w3-theme-d1 w3-round">Periode</span>
        </div>
      </div>
      <p><button class="w3-button w3-theme w3-round" id="save">Thema opslaan</button> <span id="selected" class="w3-text-grey"></span></p>
    </div>
  </main>
  <script type="module" src="/js/pages/ThemePage.js"></script>
</body>
</html>
