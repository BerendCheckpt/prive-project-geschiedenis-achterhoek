<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Route bewerken – Geschiedenis Achterhoek</title>
  <link rel="stylesheet" href="/vendor/w3css/w3.css">
  <link rel="stylesheet" href="/theme.css">
  <link rel="stylesheet" href="/vendor/ol/ol.css">
  <link rel="stylesheet" href="/css/app.css">
  <script src="/vendor/w3js/w3.js"></script>
  <script src="/vendor/ol/ol.js"></script>
</head>
<body class="w3-theme-l5">
  <div w3-include-html="/components/navbar.html"></div>
  <main class="app-below-nav">
    <div class="w3-container w3-padding-16">
      <h2 id="heading">Nieuwe route</h2>
      <div data-messages></div>
      <form class="w3-card w3-white w3-container w3-padding-16" id="form">
        <p><label>Titel *</label><input class="w3-input w3-border" name="title" required maxlength="200"></p>
        <p><label>Beschrijving</label><textarea class="w3-input w3-border" name="description" rows="3" maxlength="5000"></textarea></p>
        <p><label><input class="w3-check" type="checkbox" name="published" checked> Gepubliceerd</label></p>

        <div class="w3-row-padding w3-stretch">
          <div class="w3-third">
            <h4>Beschikbare verhalen</h4>
            <input class="w3-input w3-border w3-margin-bottom" id="search" placeholder="Zoeken…" aria-label="Zoek verhalen">
            <ul class="w3-ul w3-border w3-hoverable" id="available" style="max-height:420px;overflow:auto"></ul>
          </div>
          <div class="w3-third">
            <h4>Stops in deze route</h4>
            <ol class="w3-ul w3-border" id="stops"></ol>
          </div>
          <div class="w3-third">
            <h4>Voorbeeld</h4>
            <div id="map" class="app-map-small w3-border"></div>
          </div>
        </div>
        <p>
          <button class="w3-button w3-theme w3-round">Opslaan</button>
          <a class="w3-button w3-theme-l4 w3-round" href="/manage/routes.html">Terug</a>
        </p>
      </form>
    </div>
  </main>
  <script type="module" src="/js/pages/RouteEditPage.js"></script>
</body>
</html>
